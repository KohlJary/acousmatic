[project]
name = "acousmatic"
version = "0.1.0"
description = "Deterministic listening: turn a recorded song into a time-ordered record of what is heard in it."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "librosa>=1.0", "soundfile", "pyloudnorm", "music21", "matplotlib", "scikit-learn"]

[project.scripts]
acousmatic = "acousmatic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acousmatic"]
